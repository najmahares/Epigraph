<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epigraph</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient-bg" id="ambientBg"></div>

    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-top">
          
          <div class="brand-container">
            <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
               <text x="50" y="78" font-family="'Playfair Display', serif" font-size="95" font-style="italic" fill="#c9a96e" text-anchor="middle">e</text>
            </svg>
            <h1 class="sidebar-title">Epigraph</h1>
          </div>

          <div class="sidebar-line"></div>
          <p class="sidebar-subtitle">100+ Quotes</p>
          
          <button id="searchBtn" class="search-trigger">
            <div class="search-trigger-left">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              Search
            </div>
            <kbd>⌘K</kbd>
          </button>

          <div class="nav-list" id="navList"></div>
        </div>
        <div class="sidebar-bottom">
          
          <button id="favToggleBtn" class="fav-toggle-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            View Favorites
          </button>

          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
          <p class="progress-text" id="progressText">0% through</p>
        </div>
      </aside>

      <main class="main" id="main"></main>

      <button class="back-to-top" id="backToTop" aria-label="Back to top">
        &#8593;
      </button>
    </div>

    <div class="command-palette-overlay" id="searchOverlay">
      <div class="command-palette">
        <div class="command-input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Search quotes, authors..." autocomplete="off" />
          <kbd>ESC</kbd>
        </div>
        <div class="command-results" id="searchResults"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
